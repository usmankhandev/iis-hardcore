- name: check if the server is running Server Core
  ansible.builtin.set_fact:
    is_server_core: "{{ ansible_facts.os_installation_type == 'Server Core' }}"

- name: Install IIS Features and ASP.NET 4.x features
  ansible.windows.win_feature:
    name: "{{ iis_features + ([] if is_server_core else iis_gui_features) }}"
    state: present
  register: iis_install

- name: Reboot if a feature installation requires it
  ansible.windows.win_reboot:
    msg: "Rebooting to complete IIS installation"
    pre_reboot_delay: 5
    reboot_timeout: 600
  when: iis_install.reboot_required

- name: Stop Windows Update Rebooting Servers Mid-lab
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword

- name: Remove the default web site so port 80 is free for application to be deployed
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration
      $Ansible.Changed = $false
      if (Test-Path 'IIS:\Sites\Default Web Site') {
        Remove-Item 'IIS:\Sites\Default Web Site' -Recurse -Force
        $Ansible.Changed = $true
      }

- name: Create the application root directory
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
  - "{{ app_root }}"
  - '{{ app_root }}\releases'
  - '{{ app_root }}\packages'
